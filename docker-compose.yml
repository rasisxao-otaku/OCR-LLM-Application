services:

  api:
    build:
      context: ./WebApplication1
    ports:
      - "5000:8080"
    depends_on:
      - ocr
      - qdrant
      - ollama


  ocr:
    build:
      context: ./ocr-service
    ports:
      - "8000:8000"


  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"


  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: